name: Deploy to Google Cloud Run (MediCopilot)

on:
  push:
    branches: [ main, master ]

env:
  PROJECT_ID: medicopilot-503723
  REGION: us-central1
  BACKEND_SERVICE: medicopilot-backend
  FRONTEND_SERVICE: medicopilot-frontend

jobs:
  deploy-to-cloud-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for Artifact Registry / GCR
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Backend Image
      run: |
        docker build -t gcr.io/$PROJECT_ID/$BACKEND_SERVICE:${{ github.sha }} .
        docker push gcr.io/$PROJECT_ID/$BACKEND_SERVICE:${{ github.sha }}

    - name: Deploy Backend to Cloud Run
      run: |
        gcloud run deploy $BACKEND_SERVICE \
          --image gcr.io/$PROJECT_ID/$BACKEND_SERVICE:${{ github.sha }} \
          --platform managed \
          --region $REGION \
          --allow-unauthenticated \
          --port 8000

    - name: Build and Push Frontend Image
      run: |
        docker build -t gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:${{ github.sha }} ./frontend
        docker push gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:${{ github.sha }}

    - name: Deploy Frontend to Cloud Run
      run: |
        gcloud run deploy $FRONTEND_SERVICE \
          --image gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:${{ github.sha }} \
          --platform managed \
          --region $REGION \
          --allow-unauthenticated \
          --port 3000
