apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicopilot-api
  labels:
    app: medicopilot-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: medicopilot-api
  template:
    metadata:
      labels:
        app: medicopilot-api
    spec:
      containers:
      - name: medicopilot
        image: medicopilot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medicopilot-service
spec:
  type: ClusterIP
  selector:
    app: medicopilot-api
  ports:
  - port: 80
    targetPort: 8000
