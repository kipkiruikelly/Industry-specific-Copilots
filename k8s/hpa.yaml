apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medicopilot-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medicopilot-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medicopilot-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: medicopilot-api
